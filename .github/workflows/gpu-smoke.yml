name: GPU smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-smoke:
    name: Training smoke (self-hosted GPU)
    runs-on: [self-hosted, gpu]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Sync training dependencies
        run: uv sync --extra training
      - name: Run training smoke
        run: uv run python -m brainforge.training.smoke

site_name: BrainForge
site_description: Agentic tooling for security & coding datasets and small local models.
repo_url: https://gitlab.com/6admin.io/brainforge
repo_name: brainforge

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - navigation.tracking

nav:
  - Home: index.md
  - Tutorials:
      - tutorials/first-dataset.md
  - How-to guides:
      - how-to/configure-providers.md
      - how-to/index-and-search-rag.md
      - how-to/generate-dataset.md
      - how-to/manage-datasets.md
      - how-to/add-domain-pack.md
      - how-to/write-an-adr.md
  - Reference:
      - reference/configuration.md
      - reference/providers.md
      - reference/cli.md
      - reference/dataset-format.md
      - reference/quality-gates.md
      - reference/rag.md
      - reference/training.md
      - reference/ci.md
  - Explanation:
      - explanation/architecture.md
      - explanation/contamination.md
      - explanation/judge-correlation.md
  - Decision records:
      - adr/index.md
      - adr/0001-json-config-pydantic-schema.md
      - adr/0002-multi-teacher-ensemble-independent-judge.md
      - adr/0003-contamination-controls-postcutoff-holdout.md
      - adr/0004-provider-abstraction-openai-sdk.md
      - adr/0005-rag-fastembed-numpy-sqlite.md
      - adr/0006-modular-domain-packs.md
      - adr/0007-dataset-format-messages-metadata.md
      - adr/0008-tooling-uv-mise-src-layout.md
      - adr/0009-sqlite-response-cache.md
      - adr/0010-qlora-training-single-rtx-3080.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - tables

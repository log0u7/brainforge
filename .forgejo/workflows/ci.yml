name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Portable GitHub-Actions-compatible workflow for Forgejo (act_runner).
# Untested against a live runner yet: actions are fetched by full URL and
# jobs run in a pinned container so the runner label config does not matter.
# Build/artifact and GPU smoke jobs are intentionally omitted here.

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    container: node:20-bookworm
    steps:
      - uses: https://github.com/actions/checkout@v7
      - uses: https://github.com/jdx/mise-action@v4
      - name: Sync dependencies
        run: uv sync
      - name: Run ruff
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .

  mypy:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    container: node:20-bookworm
    steps:
      - uses: https://github.com/actions/checkout@v7
      - uses: https://github.com/jdx/mise-action@v4
      - name: Sync dependencies
        run: uv sync
      - name: Run mypy
        run: uv run mypy

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    container: node:20-bookworm
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Full history clone
        run: |
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch -q origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: Install gitleaks (checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" checksums.txt | sha256sum --check --status
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Run gitleaks
        run: ./gitleaks git --redact -v .

  test:
    name: Tests
    runs-on: ubuntu-latest
    container: node:20-bookworm
    steps:
      - uses: https://github.com/actions/checkout@v7
      - uses: https://github.com/jdx/mise-action@v4
      - name: Sync dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest -m "not integration" --cov=brainforge --cov-report=term

  config:
    name: Config validation + mock pipeline
    runs-on: ubuntu-latest
    container: node:20-bookworm
    steps:
      - uses: https://github.com/actions/checkout@v7
      - uses: https://github.com/jdx/mise-action@v4
      - name: Sync dependencies
        run: uv sync
      - name: Validate config
        run: |
          uv run brainforge config validate
          uv run brainforge config schema --check
      - name: Mock pipeline run
        run: uv run brainforge pipeline run security_dataset --input examples/cases --provider mock

  audit:
    name: Dependency CVE audit (pip-audit)
    runs-on: ubuntu-latest
    container: node:20-bookworm
    steps:
      - uses: https://github.com/actions/checkout@v7
      - uses: https://github.com/jdx/mise-action@v4
      - name: Sync dependencies
        run: uv sync
      - name: Run pip-audit
        run: |
          uv export --format requirements-txt --no-dev --no-hashes --no-emit-project -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --strict

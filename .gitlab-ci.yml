stages:
  - lint
  - test
  - build
  - pages
  - gpu

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

default:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm
  interruptible: true
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache

variables:
  UV_CACHE_DIR: .uv-cache

lint:
  stage: lint
  script:
    - uv sync
    - uv run ruff check .
    - uv run ruff format --check .

secrets:
  stage: lint
  image:
    name: gitleaks/gitleaks:latest
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  script:
    - gitleaks detect --source . --verbose --redact

test:
  stage: test
  script:
    - uv sync
    - uv run pytest -m "not integration" --cov=brainforge --cov-report=term
  coverage: '/^TOTAL.+?(\d+\.\d+%)$/'

config:
  stage: test
  script:
    - uv sync
    - uv run brainforge config validate
    - uv run brainforge config schema --check
    - uv run brainforge pipeline run security_dataset --input examples/cases --provider mock

build:
  stage: build
  script:
    - uv sync
    - uv build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

pages:
  stage: pages
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - uv sync
    - uv run mkdocs build --strict --site-dir public
  artifacts:
    paths:
      - public/

train-smoke:
  stage: gpu
  tags: [gpu]
  when: manual
  allow_failure: true
  script:
    - uv sync --extra training
    - uv run python -m brainforge.training.smoke

[project]
name = "brainforge"
version = "0.1.0"
description = "Agentic tooling for building security & coding datasets and training small local language models."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "log0u7", email = "logout@aconitus-napellus" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "typer>=0.12",
    "rich>=13.8",
    "httpx>=0.27",
    "openai>=1.50",
    "fastembed>=0.4",
]

[project.optional-dependencies]
training = [
    "torch>=2.4",
    "transformers>=4.45",
    "peft>=0.13",
    "trl>=0.11",
    "bitsandbytes>=0.44",
    "accelerate>=1.0",
    "datasets>=3.0",
]

[project.scripts]
brainforge = "brainforge.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "mypy>=1.11",
    "mutmut>=3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brainforge"]

[tool.mypy]
python_version = "3.12"
files = ["src/brainforge"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*", "peft.*", "trl.*", "fastembed.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "datasets"
follow_imports = "skip"
ignore_missing_imports = true

[tool.mutmut]
source_paths = ["src/brainforge"]
also_copy = ["config/", "examples/"]
pytest_add_cli_args_test_selection = ["tests/unit", "-q"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: cross-boundary tests via subprocess (opt-in via BRAINFORCE_IT=1)",
    "slow: tests requiring model downloads",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["SIM108"]

[tool.ruff.lint.per-file-ignores]
"src/brainforge/cli/*" = ["B008"]

[tool.coverage.run]
source = ["src/brainforge"]

[tool.coverage.report]
fail_under = 85
show_missing = true

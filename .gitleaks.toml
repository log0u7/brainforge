# Gitleaks config: default rules plus this repository's documented
# false positives. See https://github.com/gitleaks/gitleaks#configuration
[extend]
useDefault = true

[[allowlists]]
description = "Synthetic decoys inside public CTF challenge dumps (fictional content, not credentials)"
